[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-manipulation"
version = "0.1.0"
description = "Language-conditioned Vision-Language-Action robot manipulation system (SO-101 / LeRobot)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project author" }]

# Runtime deps are pinned in requirements.txt (some, e.g. bitsandbytes, are
# platform-specific and better installed there). This keeps `pip install -e .`
# working on any machine for the import path without dragging in CUDA-only wheels.
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=6", "matplotlib>=3.8"]

[project.scripts]
vla-train = "vla.training.train_bc:main"
vla-evaluate = "vla.eval.evaluate:main"
vla-serve = "vla.inference.policy_server:main"
vla-randomize = "vla.data.randomization:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
