# Phase 4, option A: fine-tune SmolVLA (450M) — the easiest VLA path, entirely
# inside LeRobot. Fits on a single 24 GB GPU. This is the recommended first VLA
# because it needs no format conversion and reuses LeRobot's async inference.
#
# Equivalent CLI:
#   lerobot-train \
#     --policy.path=lerobot/smolvla_base \
#     --dataset.repo_id=<hf_user>/so101_tabletop_v1 \
#     --batch_size=64 --steps=20000 \
#     --output_dir=outputs/smolvla_v1 --wandb.enable=true

policy:
  path: "lerobot/smolvla_base"   # pretrained checkpoint to fine-tune from
  type: smolvla

dataset:
  repo_id: "local/so101_tabletop_v1"

train:
  batch_size: 64
  steps: 20000
  optimizer_lr: 1.0e-4

output_dir: "outputs/smolvla_v1"
